<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Shop: Products</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <h1>Products</h1>
      <div class="controls">
        <div>
          <label for="search">Search products</label>
          <input id="search" type="search" placeholder="e.g. backpack" />
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="all">All categories</option>
            <option>Accessories</option>
            <option>Clothing</option>
            <option>Electronics</option>
            <option>Home</option>
          </select>
        </div>
        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="name-asc">Name (A to Z)</option>
            <option value="name-desc">Name (Z to A)</option>
            <option value="price-asc">Price (low to high)</option>
            <option value="price-desc">Price (high to low)</option>
          </select>
        </div>
      </div>
      <p data-testid="result-count" class="muted"></p>
      <div id="loading" class="spinner" role="status">Loading products…</div>
      <p id="empty" hidden>No products match your search.</p>
      <ul id="product-list" class="products" aria-label="Products"></ul>
    </main>
    <script src="/js/bugs.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/inventory.js"></script>
  </body>
</html>
