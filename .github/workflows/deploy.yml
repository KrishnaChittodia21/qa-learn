# Builds the site (everything runs in the browser) and publishes dist/ to GitHub Pages, after lint, the content
# validators, unit tests and the e2e suite (run against the built site) pass.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab (any branch)

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a deploy that's already publishing finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # builds dist/ itself, then checks it: no /api call, exams graded in the browser, answers after an attempt, CSP
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
