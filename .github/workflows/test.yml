# Runs every check on every push and pull request: lint, content validators, unit tests, the build (with its
# answers-in-bundle check), the qa-api service tests, and the Playwright e2e + accessibility suite.
# MongoDB runs as a throwaway service container; nothing here touches a real database.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # a known high or critical advisory in any dependency fails the run (security audit, M11)
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run build

  service:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      # the service imports shared rules and content from the app (src/), which need the app's packages
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm audit --audit-level=high --prefix api
      - run: npx tsc --noEmit -p api
      - run: npm test --prefix api

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.api.log
          retention-days: 7
